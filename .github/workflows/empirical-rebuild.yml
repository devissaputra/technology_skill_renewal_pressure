name: Empirical rebuild

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_and_analyze.py"
      - "research/**"
      - "tests/**"
      - "data/source_manifest.json"
      - "data/derived/**"
      - "results/empirical_summary.json"
      - "assets/**"
      - ".github/workflows/empirical-rebuild.yml"

concurrency:
  group: empirical-rebuild-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Rebuild from pinned O*NET sources
        run: python scripts/fetch_and_analyze.py --write
      - name: Run release tests
        run: pytest -q
      - name: Require zero source-to-output diff
        run: |
          git diff --exit-code --             data/source_manifest.json             data/derived/primary_results.csv             data/derived/secondary_results.csv             data/derived/robustness_results.csv             results/empirical_summary.json             assets/architecture.svg             assets/method.svg             assets/evaluation.svg             assets/research_design.svg
