<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Technology skill renewal pressure across 902 O*NET occupations</title>
<desc id="desc">Scientific summary of software skill overlap between O*NET 2020 and 2026, showing common-code Jaccard 0.7016, occupation heterogeneity, and category-level sensitivity 0.8169.</desc>
<rect width="1200" height="675" fill="#F8FAFC"/>
<rect x="0" y="0" width="1200" height="98" fill="#123B67"/>
<text x="50" y="42" fill="#FFFFFF" font-family="IBM Plex Sans,Arial,sans-serif" font-size="29" font-weight="700">Technology Skill Renewal Pressure</text>
<text x="50" y="73" fill="#DCEBFA" font-family="IBM Plex Sans,Arial,sans-serif" font-size="15">O*NET 25.1 (2020) → O*NET 31.0 (2026) · 902 common occupations</text>
<rect x="977" y="26" width="170" height="38" rx="19" fill="#0EA5A4"/>
<text x="1062" y="51" text-anchor="middle" fill="#FFFFFF" font-family="IBM Plex Sans,Arial,sans-serif" font-size="13" font-weight="700">EMPIRICAL STUDY</text>

<g font-family="IBM Plex Sans,Arial,sans-serif">
  <rect x="50" y="128" width="515" height="238" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="78" y="164" fill="#172033" font-size="18" font-weight="700">Pair persistence within common occupations</text>
  <text x="78" y="190" fill="#64748B" font-size="13">Unique occupation × normalized software pairs</text>

  <rect x="82" y="225" width="188" height="94" rx="14" fill="#DBEAFE" stroke="#60A5FA"/>
  <text x="176" y="255" text-anchor="middle" fill="#1D4ED8" font-size="13" font-weight="700">2020</text>
  <text x="176" y="291" text-anchor="middle" fill="#0F172A" font-size="30" font-weight="700">28,929</text>
  <text x="176" y="311" text-anchor="middle" fill="#475569" font-size="11">unique pairs</text>

  <rect x="345" y="225" width="188" height="94" rx="14" fill="#CCFBF1" stroke="#2DD4BF"/>
  <text x="439" y="255" text-anchor="middle" fill="#0F766E" font-size="13" font-weight="700">2026</text>
  <text x="439" y="291" text-anchor="middle" fill="#0F172A" font-size="30" font-weight="700">31,065</text>
  <text x="439" y="311" text-anchor="middle" fill="#475569" font-size="11">common-code pairs</text>

  <line x1="270" y1="272" x2="345" y2="272" stroke="#94A3B8" stroke-width="3"/>
  <circle cx="307" cy="272" r="31" fill="#7C3AED"/>
  <text x="307" y="268" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">24,736</text>
  <text x="307" y="284" text-anchor="middle" fill="#EDE9FE" font-size="9">persisted</text>

  <text x="78" y="348" fill="#334155" font-size="13">Common-code Jaccard</text>
  <text x="497" y="348" text-anchor="end" fill="#7C3AED" font-size="22" font-weight="700">0.7016</text>

  <rect x="595" y="128" width="555" height="238" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="623" y="164" fill="#172033" font-size="18" font-weight="700">Renewal pressure is not uniform</text>
  <text x="623" y="190" fill="#64748B" font-size="13">Occupation-level Jaccard distribution</text>

  <line x1="650" y1="270" x2="1097" y2="270" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round"/>
  <line x1="842" y1="270" x2="1031" y2="270" stroke="#60A5FA" stroke-width="12" stroke-linecap="round"/>
  <circle cx="957" cy="270" r="13" fill="#123B67"/>
  <g fill="#475569" font-size="11">
    <text x="650" y="302" text-anchor="middle">0.0</text>
    <text x="842" y="302" text-anchor="middle">Q10 0.429</text>
    <text x="957" y="302" text-anchor="middle">Median 0.692</text>
    <text x="1031" y="302" text-anchor="middle">Q90 0.852</text>
    <text x="1097" y="302" text-anchor="middle">1.0</text>
  </g>
  <rect x="623" y="322" width="235" height="28" rx="14" fill="#FFF7ED"/>
  <text x="741" y="341" text-anchor="middle" fill="#C2410C" font-size="12" font-weight="700">13.97% below 0.50</text>
  <rect x="873" y="322" width="249" height="28" rx="14" fill="#ECFDF5"/>
  <text x="998" y="341" text-anchor="middle" fill="#047857" font-size="12" font-weight="700">36.03% at or above 0.75</text>

  <rect x="50" y="396" width="1100" height="174" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="78" y="433" fill="#172033" font-size="18" font-weight="700">Sensitivity check: exact software names vs broader O*NET categories</text>
  <text x="78" y="459" fill="#64748B" font-size="13">Broader categories are more stable, so some apparent renewal is naming or within-category turnover.</text>

  <text x="88" y="507" fill="#334155" font-size="13" font-weight="700">Exact software-name overlap</text>
  <rect x="300" y="489" width="586" height="24" rx="12" fill="#E2E8F0"/>
  <rect x="300" y="489" width="411" height="24" rx="12" fill="#7C3AED"/>
  <text x="905" y="507" fill="#7C3AED" font-size="18" font-weight="700">0.7016</text>

  <text x="88" y="551" fill="#334155" font-size="13" font-weight="700">Category-name overlap</text>
  <rect x="300" y="533" width="586" height="24" rx="12" fill="#E2E8F0"/>
  <rect x="300" y="533" width="479" height="24" rx="12" fill="#0EA5A4"/>
  <text x="905" y="551" fill="#0F766E" font-size="18" font-weight="700">0.8169</text>

  <rect x="50" y="598" width="1100" height="47" rx="12" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="72" y="627" fill="#9A3412" font-size="13" font-weight="700">Interpretation boundary:</text>
  <text x="226" y="627" fill="#7C2D12" font-size="13">renewal pressure supports workforce planning; it is not a causal rate of human skill depreciation.</text>
</g>
</svg>