<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><ns0:rect width="100%" height="100%" fill="white" /><ns0:text x="50" y="55" font-family="Arial" font-size="29" font-weight="700">Technology Skill Renewal Pressure — Method</ns0:text><ns0:text x="50" y="88" font-family="Arial" font-size="16">How much do occupation-technology portfolios change between O*NET 25.1 and 31.0?</ns0:text><ns0:circle cx="82" cy="170" r="24" fill="#f0f0f0" stroke="#222" /><ns0:text x="82" y="177" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">1</ns0:text><ns0:rect x="125" y="135" width="1000" height="70" rx="12" fill="#f8f8f8" stroke="#444" /><ns0:text x="150" y="164" font-family="Arial" font-size="16">Load O*NET 25.1 Technology Skills and 31.0 Software Skills and normalize example strings.</ns0:text><ns0:circle cx="82" cy="258" r="24" fill="#f0f0f0" stroke="#222" /><ns0:text x="82" y="265" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">2</ns0:text><ns0:rect x="125" y="223" width="1000" height="70" rx="12" fill="#f8f8f8" stroke="#444" /><ns0:text x="150" y="252" font-family="Arial" font-size="16">Construct unique occupation–technology pairs and restrict occupation-level comparison to 902 codes</ns0:text><ns0:text x="150" y="275" font-family="Arial" font-size="16">appearing in both releases.</ns0:text><ns0:circle cx="82" cy="346" r="24" fill="#f0f0f0" stroke="#222" /><ns0:text x="82" y="353" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">3</ns0:text><ns0:rect x="125" y="311" width="1000" height="70" rx="12" fill="#f8f8f8" stroke="#444" /><ns0:text x="150" y="340" font-family="Arial" font-size="16">Compute global and occupation-level Jaccard similarity and retain official Hot Technology / In Demand</ns0:text><ns0:text x="150" y="363" font-family="Arial" font-size="16">flags descriptively.</ns0:text><ns0:circle cx="82" cy="434" r="24" fill="#f0f0f0" stroke="#222" /><ns0:text x="82" y="441" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">4</ns0:text><ns0:rect x="125" y="399" width="1000" height="70" rx="12" fill="#f8f8f8" stroke="#444" /><ns0:text x="150" y="428" font-family="Arial" font-size="16">Interpret low similarity as renewal pressure while acknowledging taxonomy and measurement changes across</ns0:text><ns0:text x="150" y="451" font-family="Arial" font-size="16">releases.</ns0:text></ns0:svg>